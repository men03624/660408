name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Instalar NDK e plataforma
        run: |
          SDKM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;21.4.7075529" "platforms;android-30" "build-tools;30.0.3" "cmake;3.10.2.4988404"
      - name: Baixar cocos2d-x 4.0
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git clone --depth 1 --branch cocos2d-x-4.0 https://github.com/cocos2d/cocos2d-x.git $HOME/cocos2d-x
          cd $HOME/cocos2d-x
          git submodule update --init --depth 1 tools/cocos2d-console tools/bindings-generator
          cat external/config.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq python2 || true
          (python2 download-deps.py -r yes) || echo "python2 falhou"
          if [ ! -f external/CMakeLists.txt ]; then
            URL=$(python3 -c "import json;c=json.load(open('external/config.json'));print(c.get('repo_parent','https://github.com/cocos2d/')+c.get('repo_name','cocos2d-x-3rd-party-libs-bin')+'/archive/'+c['version']+'.zip')")
            echo $URL
            curl -L -o /tmp/deps.zip "$URL"
            mkdir -p /tmp/deps
            unzip -q /tmp/deps.zip -d /tmp/deps
            cp -r /tmp/deps/*/* external/
          fi
          ls external
          test -f external/CMakeLists.txt
      - name: Criar projeto copiando o template
        run: |
          mkdir -p $HOME/proj
          cp -r $HOME/cocos2d-x/templates/cpp-template-default $HOME/proj/MutantFridge
          rsync -a --exclude='.git' --exclude='tests' --exclude='docs' $HOME/cocos2d-x/ $HOME/proj/MutantFridge/cocos2d/
          find $HOME/proj/MutantFridge/cocos2d -iname "CocosBuilder.h"
      - name: Juntar assets e codigo
        run: |
          echo "=== arquivos do repositorio ==="
          find . -not -path './.git/*' -not -path './assets_parts/*' | head -40
          cat assets_parts/assets.zip.part* > /tmp/assets.zip
          unzip -q /tmp/assets.zip -d /tmp/a
          cp -r /tmp/a/assets/* $HOME/proj/MutantFridge/Resources/
          APP=$(find . -iname 'AppDelegate.cpp' -not -path './.git/*' | head -1)
          echo "AppDelegate encontrado em: $APP"
          test -n "$APP"
          cp "$APP" $HOME/proj/MutantFridge/Classes/AppDelegate.cpp
      - name: Converter plists
        run: |
          python3 -c "import plistlib,glob;fs=glob.glob('$HOME/proj/MutantFridge/Resources/data/*.plist');ds=[(f,plistlib.dumps(plistlib.load(open(f,'rb')),fmt=plistlib.FMT_XML)) for f in fs];[open(f,'wb').write(d) for f,d in ds];print('plists convertidos:',len(fs))"
      - name: Aplicar assets 2x
        run: |
          ls -la assets_ipa2x.zip
          unzip -o -q assets_ipa2x.zip -d $HOME/proj/MutantFridge/Resources
          F=$HOME/proj/MutantFridge/Classes/AppDelegate.cpp
          echo "--- caracteres nao-ASCII antes do reparo ---"
          grep -nP '[^\x00-\x7F]' $F | head -10 || echo "nenhum"
          perl -CSD -pi -e 's/\x{FF5B}/{/g; s/\x{FF5D}/}/g; s/\x{FE5B}/{/g; s/\x{FE5C}/}/g; s/\x{2774}/{/g; s/\x{2775}/}/g; s/\x{00A0}/ /g; s/[\x{200B}-\x{200F}\x{2028}\x{2029}\x{FEFF}]//g; s/[\x{2018}\x{2019}]/\x27/g; s/[\x{201C}\x{201D}]/"/g; s/\r//g' $F
          perl -pi -e 's/^\s*if \(charged\).*$/    if (charged) { cb = 3; chg = true; }/' $F
          echo "--- linhas 496 a 499 ---"
          sed -n '496,499p' $F | cat -A | cut -c1-150
          echo "abre chaves: $(tr -cd '{' < $F | wc -c)  fecha chaves: $(tr -cd '}' < $F | wc -c)"
          echo "linhas: $(wc -l < $F)"
          grep -q "setContentScaleFactor" $F || sed -i 's/setDesignResolutionSize(\([^;]*\));/setDesignResolutionSize(\1); director->setContentScaleFactor(2.0f);/' $F
          grep -n "ContentScaleFactor" $F || echo "AVISO: nao consegui inserir o ajuste de escala"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - name: Deixar so o CMake 3.10.2
        run: |
          sudo find $ANDROID_SDK_ROOT/cmake -mindepth 1 -maxdepth 1 ! -name '3.10.2*' -exec rm -rf {} +
          ls $ANDROID_SDK_ROOT/cmake
      - name: Compilar APK
        run: |
          cd $HOME/proj/MutantFridge/proj.android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> local.properties
          sed -i 's/^PROP_APP_ABI=.*/PROP_APP_ABI=arm64-v8a/; s/^PROP_TARGET_SDK_VERSION=.*/PROP_TARGET_SDK_VERSION=30/; s/^PROP_MIN_SDK_VERSION=.*/PROP_MIN_SDK_VERSION=21/' gradle.properties
          cat gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mutant-fridge-apk
          path: ~/proj/MutantFridge/proj.android/app/build/outputs/apk/debug/*.apk
