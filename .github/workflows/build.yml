name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Instalar NDK e plataforma
        run: |
          SDKM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;21.4.7075529" "platforms;android-30" "build-tools;30.0.3" "cmake;3.10.2.4988404"
      - name: Baixar cocos2d-x 4.0
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git clone --depth 1 --branch cocos2d-x-4.0 https://github.com/cocos2d/cocos2d-x.git $HOME/cocos2d-x
          cd $HOME/cocos2d-x
          git submodule update --init --depth 1 tools/cocos2d-console tools/bindings-generator
          cat external/config.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq python2 || true
          (python2 download-deps.py -r yes) || echo "python2 falhou"
          if [ ! -f external/CMakeLists.txt ]; then
            echo "Baixando dependencias direto"
            URL=$(python3 -c "import json;c=json.load(open('external/config.json'));print(c.get('repo_parent','https://github.com/cocos2d/')+c.get('repo_name','cocos2d-x-3rd-party-libs-bin')+'/archive/'+c['version']+'.zip')")
            echo $URL
            curl -L -o /tmp/deps.zip "$URL"
            mkdir -p /tmp/deps
            unzip -q /tmp/deps.zip -d /tmp/deps
            ls /tmp/deps
            cp -r /tmp/deps/*/* external/
          fi
          ls external
          test -f external/CMakeLists.txt
      - name: Criar projeto copiando o template
        run: |
          mkdir -p $HOME/proj
          cp -r $HOME/cocos2d-x/templates/cpp-template-default $HOME/proj/MutantFridge
          rsync -a --exclude='.git' --exclude='tests' --exclude='docs' $HOME/cocos2d-x/ $HOME/proj/MutantFridge/cocos2d/
          ls $HOME/proj/MutantFridge $HOME/proj/MutantFridge/proj.android
      - name: Juntar assets e codigo
        run: |
          cat assets_parts/assets.zip.part* > /tmp/assets.zip
          unzip -q /tmp/assets.zip -d /tmp/a
          cp -r /tmp/a/assets/* $HOME/proj/MutantFridge/Resources/
          cat > $HOME/proj/MutantFridge/Classes/AppDelegate.cpp <<'EOF'
          #include "AppDelegate.h"
          #include "cocos2d.h"
          #include "editor-support/cocosbuilder/CocosBuilder.h"
          USING_NS_CC;
          using namespace cocosbuilder;
          AppDelegate::AppDelegate() {}
          AppDelegate::~AppDelegate() {}
          void AppDelegate::initGLContextAttrs() {
              GLContextAttrs glContextAttrs = {8, 8, 8, 8, 24, 8, 0};
              GLView::setGLContextAttrs(glContextAttrs);
          }
          bool AppDelegate::applicationDidFinishLaunching() {
              auto director = Director::getInstance();
              auto glview = director->getOpenGLView();
              if (!glview) { glview = GLViewImpl::create("Mutant Fridge Mayhem"); director->setOpenGLView(glview); }
              glview->setDesignResolutionSize(480, 320, ResolutionPolicy::FIXED_HEIGHT);
              FileUtils::getInstance()->addSearchPath("data");
              FileUtils::getInstance()->addSearchPath("textures");
              auto scene = Scene::create();
              NodeLoaderLibrary* lib = NodeLoaderLibrary::newDefaultNodeLoaderLibrary();
              CCBReader* reader = new CCBReader(lib);
              Node* menu = reader->readNodeGraphFromFile("GameMainMenu.ccbi");
              if (menu) { scene->addChild(menu); }
              else { scene->addChild(Label::createWithSystemFont("Mutant Fridge Mayhem", "Arial", 24)); }
              director->runWithScene(scene);
              return true;
          }
          void AppDelegate::applicationDidEnterBackground() { Director::getInstance()->stopAnimation(); }
          void AppDelegate::applicationWillEnterForeground() { Director::getInstance()->startAnimation(); }
          EOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - name: Deixar so o CMake 3.10.2
        run: |
          sudo find $ANDROID_SDK_ROOT/cmake -mindepth 1 -maxdepth 1 ! -name '3.10.2*' -exec rm -rf {} +
          ls $ANDROID_SDK_ROOT/cmake
      - name: Diagnostico CMake
        run: |
          NDK=$ANDROID_SDK_ROOT/ndk/21.4.7075529
          CM=$(ls -d $ANDROID_SDK_ROOT/cmake/3.10.2*)/bin
          $CM/cmake -H$HOME/proj/MutantFridge -B/tmp/cmb -G Ninja -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-16 -DANDROID_NDK=$NDK -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_STL=c++_static -DANDROID_TOOLCHAIN=clang -DANDROID_ARM_NEON=TRUE -DCMAKE_BUILD_TYPE=Debug > /tmp/cmake.txt 2>&1 || true
          echo "===== ERROS DO CMAKE ====="
          grep -n -B1 -A8 "CMake Error" /tmp/cmake.txt | head -50
          echo "===== FIM DO LOG ====="
          tail -8 /tmp/cmake.txt
      - name: Compilar APK
        run: |
          cd $HOME/proj/MutantFridge/proj.android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mutant-fridge-apk
          path: ~/proj/MutantFridge/proj.android/app/build/outputs/apk/debug/*.apk
